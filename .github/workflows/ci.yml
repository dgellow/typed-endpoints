name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - name: Bootstrap
        run: deno install --frozen

      - name: Run linters
        run: ./scripts/lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - name: Bootstrap
        run: deno install --frozen

      - name: Run tests
        run: ./scripts/test

  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Run tests under Bun
        run: ./scripts/test-bun

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - uses: astral-sh/setup-uv@v6

      - name: Bootstrap
        run: deno install --frozen

      - name: Run the generated FastAPI application against the conformance tests
        run: ./scripts/test-python

  framework-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Type-check the integrations against the frameworks
        run: ./scripts/check-framework-types
