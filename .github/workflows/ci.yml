name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every tool is installed at the version a file of the repository names,
# the same file a development machine reads:
#
#   Deno, Bun    .tool-versions
#   uv, Python   e2e_tests/python/pyproject.toml, .python-version
#   Rust         e2e_tests/rust/rust-toolchain.toml
#
# The scripts (and uv) stop on any other version, so a pin that did not
# take effect here fails the job.
#
# An action is named by commit, with the tag it was read from after it: a
# tag can be moved, a commit cannot. The commits are the ones the run of
# 2026-11-14 printed for these tags ("Download action repository").

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned versions
        id: versions
        run: sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v${{ steps.versions.outputs.deno }}
          cache: true

      - name: Bootstrap
        run: deno install --frozen

      - name: Run linters
        run: ./scripts/lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned versions
        id: versions
        run: sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v${{ steps.versions.outputs.deno }}
          cache: true

      - name: Bootstrap
        run: deno install --frozen

      - name: Run tests
        run: ./scripts/test

  test-bun:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned versions
        id: versions
        run: sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - name: Run tests under Bun
        run: ./scripts/test-bun

  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned versions
        id: versions
        run: |
          sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"
          sed -n 's/^required-version = "==\(.*\)"$/uv=\1/p' e2e_tests/python/pyproject.toml >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v${{ steps.versions.outputs.deno }}
          cache: true

      # uv installs the interpreter .python-version names, as its own build
      # (python-preference in pyproject.toml): the runner's Python is not used.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ steps.versions.outputs.uv }}

      - name: Bootstrap
        run: deno install --frozen

      - name: Run the generated FastAPI application against the conformance tests
        run: ./scripts/test-python

  test-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned versions
        id: versions
        run: |
          sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"
          sed -n 's/^channel = "\(.*\)"$/rust=\1/p' e2e_tests/rust/rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v${{ steps.versions.outputs.deno }}
          cache: true

      - name: Rust toolchain
        run: rustup toolchain install "${{ steps.versions.outputs.rust }}" --profile minimal --component clippy --component rustfmt

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            e2e_tests/rust/target
          key: rust-${{ runner.os }}-${{ steps.versions.outputs.rust }}-${{ hashFiles('e2e_tests/rust/Cargo.lock') }}

      - name: Bootstrap
        run: deno install --frozen

      - name: Run the generated axum server against the conformance tests
        run: ./scripts/test-rust

  framework-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pinned versions
        id: versions
        run: sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - name: Type-check the integrations against the frameworks
        run: ./scripts/check-framework-types
