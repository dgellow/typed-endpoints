name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The Deno that .tool-versions names: the one CI tests with.
      - name: Pinned versions
        id: versions
        run: sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v${{ steps.versions.outputs.deno }}
          cache: true

      - name: Publish to JSR
        run: deno publish --allow-slow-types
