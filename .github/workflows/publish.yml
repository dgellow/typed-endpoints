name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Deno that .tool-versions names: the one CI tests with.
      - name: Pinned versions
        id: versions
        run: sed -n 's/^\([a-z]*\) \(.*\)$/\1=\2/p' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v${{ steps.versions.outputs.deno }}
          cache: true

      - name: Publish to JSR
        run: deno publish --allow-slow-types
