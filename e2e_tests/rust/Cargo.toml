[package]
name = "typed-endpoints-rust-e2e"
version = "0.0.0"
edition = "2024"
publish = false
description = "The fixture API of typed-endpoints served by axum, from generated code"

[dependencies]
axum = "0.8"
fancy-regex = "0.16"
serde = { version = "1", features = ["derive"] }
# preserve_order: issues and members in the order the schema has them.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
